# Home Assistant automation for the intercom (TEST, branch intercom).
# Settings -> Automations & scenes -> Create automation -> Edit in YAML -> paste.
#
# Nothing to edit here when satellites are added, renamed or move:
#   - Phonebook: every board reports itself in its "Intercom endpoint" entity
#     (contact|node|IP, e.g. "VA2|esphome_va_2|192.168.11.43"). When a board comes online
#     (event esphome.intercom_online) or HA starts, this automation sends every board
#     the list of all the others (voip_stack's set_roster_json). Contact names come from
#     the boards' device_name: esphome-va-2 -> VA2.
#   - Spoken names: "call VA2", "call v-a two", "call number 2", "call 2 v-a" need no
#     setup. Other names go in the text helper "Intercom names" (optional), e.g.
#         VA1: alpha, kitchen unit; VA2: bravo
#     (Settings -> Devices & services -> Helpers -> Create helper -> Text, name
#     "Intercom names", max length 255.)
#
# Voice: "Okay Nabu, call VA2" (also "ring", "phone") on a satellite -> it calls VA2;
#   "hang up" / "end the call" -> it hangs up ("No ongoing call." when there is none).
#   A muted microphone in a call -> the other satellite shows it (slow cyan comet).
#   A call that does not connect -> the
#   calling satellite says why ("VA2 didn't answer"); a connected call lost (the other
#   side silent for 15 s, e.g. switched off) -> both satellites say "Lost the call with VA2".
#
# Per board, once: Settings -> Devices & services -> ESPHome -> the device ->
#   Configure -> "Allow the device to perform Home Assistant actions" (for its events),
#   and hide its "Intercom endpoint" entity if you like (entity settings -> Visible off;
#   keep it enabled).
alias: Intercom by voice
description: Satellite-to-satellite calls by voice, phonebook, mute and failed-call messages
mode: parallel
max: 20
triggers:
  - trigger: conversation
    id: call
    command:
      - "call [the] {name}"
      - "ring [the] {name}"
      - "phone [the] {name}"
  - trigger: conversation
    id: end
    command:
      - "end [the] call"
      - "hang up"
      - "stop [the] call"
  - trigger: event
    id: failed
    event_type: esphome.intercom_call_failed
  - trigger: event
    id: mute
    event_type: esphome.intercom_mute
  - trigger: event
    id: online
    event_type: esphome.intercom_online
  - trigger: homeassistant
    id: online
    event: start
variables:
  reasons:
    timeout: "{contact} didn't answer."
    busy: "{contact} is busy."
    declined: "{contact} declined the call."
    lost: "Lost the call with {contact}."
  # All boards from their "Intercom endpoint" entities: [{contact, node, ip, device}]
  boards: >-
    {% set ns = namespace(l=[]) %}
    {% for s in states.sensor
         if s.entity_id.endswith('_intercom_endpoint') and s.state.count('|') == 2 %}
      {% set p = s.state.split('|') %}
      {% if p[0] and p[1] and p[2] %}
        {% set ns.l = ns.l + [{'contact': p[0], 'node': p[1], 'ip': p[2],
                               'device': device_id(s.entity_id)}] %}
      {% endif %}
    {% endfor %}
    {{ ns.l }}
  # The other side named in a board's event: the contact name (VA2) or, once the call
  # connected, the other board's name in HA ("Voice Assistant 2 Intercom"): both -> its
  # board entry ({} if not found)
  peer: "{{ (trigger.event.data.contact | default('') | string) if trigger.platform == 'event' else '' }}"
  peer_board: >-
    {% set ns = namespace(b={}) %}
    {% for b in boards %}
      {% if peer and peer | lower in [b.contact | lower,
                                       (device_attr(b.device, 'name_by_user') or '') | lower,
                                       (device_attr(b.device, 'name') or '') | lower] %}
        {% set ns.b = b %}
      {% endif %}
    {% endfor %}
    {{ ns.b }}
  this_board: >-
    {{ (boards | selectattr('device', 'eq', trigger.device_id) | list | first) | default({}, true)
       if trigger.platform == 'conversation' and trigger.device_id else {} }}
actions:
  - choose:
      # ---- Phonebook: send every board the list of the others ----
      - conditions:
          - condition: trigger
            id: online
        sequence:
          - repeat:
              for_each: "{{ boards }}"
              sequence:
                - action: "esphome.{{ repeat.item.node }}_set_roster_json"
                  continue_on_error: true
                  data:
                    # "complete": true is ignored by the board; it keeps HA from turning
                    # the JSON text into an object before sending it
                    roster_json: >-
                      {% set ns = namespace(c=[]) %}
                      {% for b in boards if b.contact != repeat.item.contact %}
                        {% set ns.c = ns.c + [{'name': b.contact, 'address': b.ip,
                                               'sip_port': 5060, 'rtp_port': 40000,
                                               'transport': 'udp'}] %}
                      {% endfor %}
                      {{ {'contacts': ns.c, 'complete': true} | to_json }}

      # ---- A call that did not connect, or was lost: say why on the satellite ----
      - conditions:
          - condition: trigger
            id: failed
        sequence:
          - variables:
              satellite: >-
                {{ device_entities(trigger.event.data.device_id | default(''))
                   | select('match', 'assist_satellite\\.') | first | default('') }}
              contact: "{{ peer_board.contact | default(peer or 'the other side', true) }}"
              message: >-
                {{ reasons.get(trigger.event.data.reason, "The call to {contact} didn't go through.")
                   | replace('{contact}', contact) }}
          - if:
              - condition: template
                value_template: "{{ satellite != '' }}"
            then:
              - action: assist_satellite.announce
                target:
                  entity_id: "{{ satellite }}"
                data:
                  message: "{{ message }}"
                  preannounce: false

      # ---- A microphone muted or unmuted in a call: tell the other board ----
      - conditions:
          - condition: trigger
            id: mute
          - condition: template
            value_template: "{{ peer_board != {} }}"
        sequence:
          - action: "esphome.{{ peer_board.node }}_intercom_peer_muted"
            continue_on_error: true
            data:
              muted: "{{ trigger.event.data.muted | default('false') == 'true' }}"

      # ---- Voice: not on an intercom satellite ----
      - conditions:
          - condition: template
            value_template: "{{ trigger.platform == 'conversation' and this_board == {} }}"
        sequence:
          - set_conversation_response: "I can only do that on an intercom satellite."

      # ---- Voice: call ----
      - conditions:
          - condition: trigger
            id: call
        sequence:
          - variables:
              # what was heard, tidied: lower case, number words as digits, filler words
              # ("number", "v a", "voice assistant", ...) dropped
              key: >-
                {% set digits = {'one': '1', 'won': '1', 'two': '2', 'to': '2', 'too': '2',
                                 'three': '3', 'four': '4', 'for': '4', 'five': '5',
                                 'six': '6', 'seven': '7', 'eight': '8', 'nine': '9'} %}
                {% set filler = ['number', 'no', 'the', 'va', 'v', 'a', 'vee', 'voice',
                                 'assistant', 'unit'] %}
                {% set ns = namespace(out='') %}
                {% for w in (trigger.slots.name | lower | regex_replace('[^a-z0-9]+', ' ')).split() %}
                  {% if w not in filler %}{% set ns.out = ns.out ~ digits.get(w, w) %}{% endif %}
                {% endfor %}
                {{ ns.out | regex_replace('^va|va$', '') }}
              # names from the "Intercom names" helper: "VA1: alpha, kitchen unit; VA2: bravo",
              # tidied the same way as what was heard
              aliases: >-
                {% set digits = {'one': '1', 'won': '1', 'two': '2', 'to': '2', 'too': '2',
                                 'three': '3', 'four': '4', 'for': '4', 'five': '5',
                                 'six': '6', 'seven': '7', 'eight': '8', 'nine': '9'} %}
                {% set filler = ['number', 'no', 'the', 'va', 'v', 'a', 'vee', 'voice',
                                 'assistant', 'unit'] %}
                {% set ns = namespace(d={}, k='') %}
                {% set text = states('input_text.intercom_names') %}
                {% if text not in ['unknown', 'unavailable', ''] %}
                  {% for entry in text.split(';') if ':' in entry %}
                    {% set contact = entry.split(':')[0] | trim | upper %}
                    {% for n in entry.split(':')[1].split(',') %}
                      {% set ns.k = '' %}
                      {% for w in (n | lower | regex_replace('[^a-z0-9]+', ' ')).split() %}
                        {% if w not in filler %}{% set ns.k = ns.k ~ digits.get(w, w) %}{% endif %}
                      {% endfor %}
                      {% if ns.k %}{% set ns.d = dict(ns.d, **{ns.k: contact}) %}{% endif %}
                    {% endfor %}
                  {% endfor %}
                {% endif %}
                {{ ns.d }}
              known: "{{ boards | map(attribute='contact') | list }}"
              contact: >-
                {{ ('VA' ~ (key | int)) if key | regex_match('^[0-9]+$')
                   else aliases.get(key, (key | upper) if (key | upper) in known else '') }}
          - if:
              - condition: template
                value_template: "{{ contact not in known }}"
            then:
              - set_conversation_response: "I don't know {{ trigger.slots.name }}."
            else:
              - if:
                  - condition: template
                    value_template: "{{ contact == this_board.contact }}"
                then:
                  - set_conversation_response: "You're talking to {{ contact }}."
                else:
                  - action: "esphome.{{ this_board.node }}_start_call"
                    data:
                      dest: "{{ contact }}"
                  - set_conversation_response: "Calling {{ contact }}."

      # ---- Voice: end the call (also an unanswered or ringing one) ----
      - conditions:
          - condition: trigger
            id: end
        sequence:
          - variables:
              call_state: >-
                {{ device_entities(trigger.device_id)
                   | select('match', 'sensor\\..*_intercom_state$')
                   | map('states') | first | default('idle') }}
          - if:
              - condition: template
                value_template: >-
                  {{ call_state in ['calling', 'remote_ringing', 'ringing', 'connecting', 'in_call'] }}
            then:
              - action: "esphome.{{ this_board.node }}_hangup_call"
              - set_conversation_response: "Call ended."
            else:
              - set_conversation_response: "No ongoing call."
