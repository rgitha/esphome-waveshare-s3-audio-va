# BSS probe: test firmware for the Waveshare ESP32-S3-AUDIO-Board.
#
# Records the AFE output and every raw_data channel of Espressif's fetch result at
# the same moment, logs what they are (levels, which one the output is, correlation,
# trigger_channel_id), and plays each one back on the speaker. Same audio stack and
# AFE settings as esphome-va-1.yaml; no Home Assistant voice, wake word or media.
#
#   Key 2  record 10 s (ring fills red); a press while recording starts again. With
#          the echo test on, noise bursts play meanwhile. The idle LED blinks for
#          about a second afterwards while the recording is analysed.
#   Key 1  play the next stream; the number of white LEDs is the stream:
#          1 = AFE output (what the voice firmware sends on), 2 = raw 0, 3 = raw 1, ...
#          A press while one is playing moves on to the next.
#   Key 3  echo test on / off (idle LED amber = on, white = off)
#
# The probe component is in components/bss_probe next to this file. Flash it over
# the voice firmware; flash esphome-va-1.yaml back afterwards (HA shows esphome-va-1
# as unavailable meanwhile and does not see this device).

substitutions:
  device_name: bss-probe
  # Address of the board for OTA and logs (it is esphome-va-1 on the network until
  # this firmware is on it; set to the board's current IP)
  device_address: 192.168.11.16

  # Audio stack fork, branch bss-probe (adds the AFE result tap this probe uses)
  stack_ref: 00598fefdd1318bbeb600b2a968c0b0f567cfd70

  # Same as esphome-va-1.yaml
  es7210_gain_db: "24.0"
  master_volume_min_db: "-40"
  afe_mic_num: "2"
  afe_dual: ${ afe_mic_num == "2" or afe_mic_num == 2 }
  afe_mic_slots: ${ [0, 2] if afe_dual else [0] }

  i2s_mclk: GPIO12
  i2s_bclk: GPIO13
  i2s_lrclk: GPIO14
  i2s_din: GPIO15
  i2s_dout: GPIO16
  amp_ctrl: 8
  i2c_scl: GPIO10
  i2c_sda: GPIO11

esphome:
  name: ${device_name}
  friendly_name: BSS probe
  min_version: 2026.10.0
  on_boot:
    - priority: -100
      then:
        - light.turn_on:
            id: status_ring
            brightness: 60%
            effect: Probe

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  toolchain: esp-idf
  framework:
    type: esp-idf
    version: recommended
    advanced:
      compiler_optimization: PERF
    sdkconfig_options:
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_TX_BA_WIN: "16"
      CONFIG_ESP_WIFI_RX_BA_WIN: "16"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

psram:
  mode: octal
  speed: 80MHz

network:
  enable_high_performance: false

wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none
  use_address: ${device_address}

logger:

api:
  encryption:
    key: !secret api_key_esp32_audio_board

ota:
  - platform: esphome
    encryption: # uses the api: encryption key

i2c:
  - id: internal_i2c
    sda: $i2c_sda
    scl: $i2c_scl
    scan: true
    frequency: 100kHz

tca9555:
  id: ioexp
  i2c_id: internal_i2c
  address: 0x20

external_components:
  - source: github://rgitha/esphome-audio-stack@${stack_ref}
    components: [esp_audio_stack, esp_afe]
  - source:
      type: local
      path: components
    components: [bss_probe]

esp_audio_stack:
  id: audio_stack
  i2s_mclk_pin: $i2s_mclk
  i2s_bclk_pin: $i2s_bclk
  i2s_lrclk_pin: $i2s_lrclk
  i2s_din_pin: $i2s_din
  i2s_dout_pin: $i2s_dout
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: afe_processor
  task_core: 0
  task_priority: 19
  task_stack_size: 8192
  audio_task_stack_in_psram: true
  buffers_in_psram: true
  master_volume_min_db: ${master_volume_min_db}
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  codec:
    i2c_id: internal_i2c
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      gain_db: $es7210_gain_db
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: ${afe_mic_slots}
  tdm_ref_slot: 1

esp_afe:
  id: afe_processor
  type: sr
  mode: high_perf
  mic_num: ${afe_mic_num}
  se_enabled: ${afe_dual}
  aec_filter_length: 4
  aec_nlp_level: normal
  ns_enabled: false
  vad_enabled: true
  continuous_vad: true
  agc_enabled: false
  memory_alloc_mode: more_psram
  task_core: 1
  task_priority: 5
  ringbuf_size: 8
  feed_task_core: 1
  feed_task_priority: 5
  feed_task_stack_size: 3072
  fetch_task_core: 0
  fetch_task_priority: 5
  fetch_task_stack_size: 3072
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

microphone:
  - platform: esp_audio_stack
    id: afe_mic

speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    sample_rate: 48000
    bits_per_sample: 16
    timeout: never
    buffer_duration: 128ms

bss_probe:
  id: probe
  esp_afe_id: afe_processor
  microphone: afe_mic
  speaker: hw_speaker
  record_seconds: 10
  playback_volume: 0.8       # speaker volume for playback and the echo test
  playback_peak_db: -6       # each stream is scaled so its peak plays at this level...
  max_playback_gain_db: 40   # ...by at most this much (levels are in the log)
  test_sound_level_db: -12   # echo test noise bursts

switch:
  - platform: gpio
    id: amp_enable
    name: Amplifier
    pin:
      tca9555: ioexp
      number: $amp_ctrl
      inverted: false
    restore_mode: ALWAYS_ON

light:
  - platform: esp32_rmt_led_strip
    id: status_ring
    internal: true
    pin: GPIO38
    num_leds: 7
    chipset: WS2812
    channel_colors: RGB
    default_transition_length: 0s
    restore_mode: ALWAYS_OFF
    effects:
      - addressable_lambda:
          name: Probe
          update_interval: 50ms
          lambda: |-
            for (int i = 0; i < it.size(); i++)
              it[i] = id(probe).led_color(i, it.size());

binary_sensor:
  - platform: gpio
    name: Key1
    internal: true
    pin:
      tca9555: ioexp
      number: 9
      inverted: true
    on_press:
      - lambda: id(probe).key_play_next();

  - platform: gpio
    name: Key2
    internal: true
    pin:
      tca9555: ioexp
      number: 10
      inverted: true
    on_press:
      - lambda: id(probe).key_record();

  - platform: gpio
    name: Key3
    internal: true
    pin:
      tca9555: ioexp
      number: 11
      inverted: true
    on_press:
      - lambda: id(probe).key_toggle_echo_test();
