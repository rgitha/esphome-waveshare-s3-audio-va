#    set_action:
#      - lambda: |-
#          id(va).set_auto_gain(x);   // adjust auto gain on the fly
#      - logger.log:
#          format: "[VA] Set auto gain to %.0f"
#          args: ["x"]

#  - platform: template
#    id: va_noise_suppression
#    name: "Noise Suppression"
#    entity_category: config
#    min_value: 0
#    max_value: 4
#    step: 1
#    restore_value: true
#    initial_value: 4
#    set_action:
#      - lambda: |-
#          id(va).set_noise_suppression_level(x);   // adjust noise suppression on the fly
#      - logger.log:
#          format: "[VA] Set noise suppression to %.0f"
#          args: ["x"]

  - platform: template
    id: led_ring_brightness
    name: "LED Ring Brightness"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.2
    max_value: 1.0
    step: 0.05
    initial_value: 0.8
    mode: slider
    on_value:
      - if:
          condition:
            light.is_on: status_ring
          then:
            - light.turn_on:
                id: status_ring
                brightness: !lambda 'return x;'

  - platform: template
    id: night_volume
    name: "Night volume"
    icon: mdi:volume-low
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.0
    max_value: 1.0
    step: 0.05
    initial_value: 0.3
    mode: slider

  - platform: template
    id: night_led_brightness
    name: "Night LED Ring Brightness"
    icon: mdi:brightness-4
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.2
    max_value: 1.0
    step: 0.05
    initial_value: 0.4
    mode: slider

sensor:

  - platform: template
    id: next_timer
    name: "Next timer"
    update_interval: never
    disabled_by_default: true
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"
    accuracy_decimals: 0

text_sensor:
  - platform: template
    id: next_timer_name
    name: "Next timer name"
    icon: "mdi:timer"
    disabled_by_default: true
  - platform: template
    name: "Alarm time"
    id: alarm_time
    icon: mdi:bell-ring

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  - platform: gpio
    name: "Key1"
    internal: true
    pin:
      tca9555: ioexp
      number: 9 # not '12' as schematics say!
      inverted: true
    on_press:
      - media_player.volume_down: external_media_player

  - platform: gpio
    name: "Key2"
    internal: true
    pin:
      tca9555: ioexp
      number: 10
      inverted: true
    on_press:
      # A timer or alarm is ringing -> Play/Pause silences it (works even when muted)
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
          else:
            - media_player.toggle: external_media_player

  - platform: gpio
    name: "Key3"
    internal: true
    pin:
      tca9555: ioexp
      number: 11
      inverted: true
    on_press:
      - media_player.volume_up: external_media_player
