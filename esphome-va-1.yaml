# ==============================================================================
# Home Assistant voice satellite for the Waveshare ESP32-S3-AUDIO-Board.
# Based on github.com/sw3Dan/waveshare-s2-audio_esphome_voice.
# ==============================================================================
#
# CHANGELOG (2026-10-23)
# - Bugfixes, enhancements and dual mic feature - after extensive research - assisted by Claude
#
# Dual-mic AFE
# - Audio path moved to esphome-audio-stack (esp_audio_stack + esp_afe, pinned
#   v2026.11.0): 48 kHz 4-slot TDM, both mics + speaker reference -> Espressif AFE
#   (echo cancellation + dual-mic BSS) -> one clean 16 kHz mic for wake word / VA.
#   Rationale: barge-in ("stop", wake word during playback) and two-mic enhancement.
# - Replaces i2s_audio, es7210/es8311 components and the i2s mic/speaker platforms;
#   mixer, resamplers, media player, micro_wake_word and voice_assistant unchanged.
# - Slot map (verified by the intercom author): 0 = right mic, 2 = left mic,
#   1 = speaker reference, 3 = unused.
# - ES7210 gain fixed in YAML (21 dB; AFE output came out quieter at 15 dB);
#   runtime slider is now a post-AFE digital trim, 0..+18 dB.
# - mww/VA mic channel selection removed: AFE output is mono.
# - Settings follow the board-tested intercom profile (high_perf, AGC off), but
#   type sr instead of fd: fd's nonlinear processing lowered STT accuracy.
# - stop word cutoff 0.50 -> 0.75: false triggers on residual TTS echo.
# - Initial volume 85 %, night volume 50 %.
# - Adaptive volume (switch): the HA volume is the maximum; in a quiet room all
#   sound is turned down via the codec's master volume (separate gain stage, so
#   the HA slider never moves). 1 dB less per dB below the full-volume noise
#   level, capped. Noise is tracked from the raw mic level while nothing plays.
#   "Adaptive volume reduction" and "Adaptive volume level" show what is applied
#   (noise-driven updates reported at most every 10 s; 2 dB hysteresis).
# - Noise estimator: 0.5 s block peaks -> min(3rd-highest of 16 blocks, max of
#   last 9 blocks) -> exponential (6 s rise, fast fall). Rejects isolated
#   sounds (< ~1 s) and pairs of bangs, treats bursts recurring within ~2.7 s
#   as noise, ~1.5 s onset, ~4.5 s release. Replaces the earlier
#   Doblinger-style fast-fall/slow-rise tracker. (Was 2nd-highest / 5 s;
#   changed to make the volume change less often.)
# - Battery monitoring on GPIO6 (hardware mod: R78 bridged pad 1 -> pad 3, so the
#   R2/R11 divider reaches GPIO6; camera keeps GPIO1). Voltage + rough level,
#   reported every 5 min (median of 10 readings). Below 2.5 V (battery switched
#   off or unplugged) reports "unknown" at once; a reconnected battery is
#   reported on its first reading.
# - Second noise measurement: approximately A-weighted level of the processed
#   stream (HP 200 Hz 2nd order + HP 500 Hz 1st order), same estimator. The raw
#   mic level is unweighted/full-band and bottoms out around -66 dBFS (DC, rumble,
#   electrical noise), hiding 25-40 dBA changes. "Ambient noise source" selects
#   which drives adaptive volume. afe_mic_num substitution: "1" builds a
#   single-mic, no-BSS front end for comparison (BSS can't be toggled at runtime).
# - Diagnostic "Diag level 1-4": 5 s averages at raw mics, AFE input, AFE output
#   and A-weighted, to locate where the readings diverge. Reporting (with the
#   Ambient noise estimates) every 5 s while "Report ambient noise" is on.
# - Adaptive volume range: master curve floor -30 -> -40 dB, max reduction
#   limit 25 -> 35 dB (A-weighted measurement gave ~10-12 dB more dynamic range).
# - Announcement output offsets over the adapted volume (substitutions, 0 dB
#   ceiling): HA announcements (assist_satellite.announce) +6 with their
#   pre-announcement chime; chimes, TTS replies and timers/alarms unchanged.
#   set_announcement_offset action: the next HA announcement within 10 s gets a
#   further +6 (urgent).
# - Diag level 1-4 sensors and the raw mic slot levels removed; new diagnostic
#   "Speaker level (last reply)" shows each counted reply's measurement.
# - min_version 2026.10.0 (audio-stack requirement).
# - Audio stack v2026.10.2 -> v2026.11.0: 2026.10.2 no longer compiles with
#   current ESPHome (ring_buffer handle_ became a function).
# - Firmware version (fw_version substitution, esphome project/comment): shown
#   in HA device info and the ESPHome dashboard.
# - Speaker calibration rev 3 (2026.11.11.6): no dependence on echo
#   cancellation (room level from the AFE input before the wake word); each
#   detected reply sets S directly; attenuation A = clamp(S - N_A - C, 0, 30)
#   with C = 20 dB plus the new "Adaptive volume offset" (-6..+6 dB). S starts
#   at speaker_level_nominal_db (-35). Removed: full-level -55 substitution,
#   first-calibration reference, idle in/out ratio, separation guard.
# - Calibration on short replies (2026.11.11.7): 250 ms skipped at the start
#   (was 1 s, only needed for the echo canceller), 0.75 s minimum (was 2 s),
#   so replies of about 1 s and longer are measured.
# - Calibration timing and averaging (2026.11.12.1): snapshots counted from
#   550 ms after ANNOUNCING (the AFE input level is a ~30 ms snapshot every
#   ~256 ms; sound starts ~170 ms after ANNOUNCING); minimum 2 snapshots;
#   S = power mean of the last up to 3 measured replies, from the first reply on.
# - Battery median uses an insertion sort (2026.11.12.2): GCC 14 gave a false
#   array-bounds warning on std::sort.
# - Adaptive volume moved into an external component, adaptive_volume
#   (github.com/rgitha/esphome-adaptive-volume v0.1.0, 2026.11.12.3): every sample is
#   measured through the audio stack's capture interface (no 250 ms snapshots);
#   same design (flowchart rev 3). The YAML keeps one config block; intervals,
#   globals, the adaptive script and the A-weighting lambda are gone. "Report
#   ambient noise" removed: Room noise is now sent at most every 10 s, only
#   when it changes. Speaker level restarts from the nominal value (new storage).
# - Adaptive volume component v0.2.0 (2026.11.12.4): reply level from speech
#   frames only (silence and TTS start-up delay left out), A-weighted like the
#   room noise; measurements near the room may only lower S; S saved to flash
#   on a 1 dB change. Nominal speaker level -30.
# - UI tidy-up (2026.11.12.5): Microphone Mute and Alarm on moved to the
#   controls; Gain Factor Ch0/Ch1, Mic Gain, Amplifier and Speaker level (last
#   reply) hidden by default (enable in HA when tuning).
# - Mute flash: red when the microphone is muted, green when unmuted (was red
#   for both) (2026.11.12.6).
# - Stop word for streamed replies (2026.11.12.9): enabling it now waits until
#   the reply actually plays (Voice PE fix #512). Pilot LED moved to LED 1
#   (index 0); index 3 sits next to the USB connector.
# - Boot sound (2026.11.12.10): played once per boot when HA first connects,
#   skipped in night mode. Sound files are substitutions (boot/mute/unmute),
#   with Voice PE placeholders until the new chimes are online.
# - Chimes online (2026.11.12.11): boot/mute/unmute now use the chimes in this
#   repository (sounds/), via the sounds_url substitution.
# - Full ring again (2026.11.12.12): "solid" (listening) and the mute flash
#   now clear the running effect; they were drawn through Pilot on one LED.
# - Sendspin (2026.11.12.13): synchronized multi-room audio, as on Voice PE.
#   Media player is now speaker_source with media sources (audio files, HTTP,
#   Sendspin); sounds moved to audio_file and play_sound takes the file id.
#   Sendspin delay is adjustable from the server (ES8311 DAC delay unknown).
# - All external files pinned (2026.11.12.14): Voice PE sounds and the stop
#   model copied into this repository, referenced at a fixed commit (repo_ref);
#   hey_jarvis and VAD from a fixed commit of micro-wake-word-models; audio
#   stack by commit (v2026.11.0).
# - Reply LEDs (2026.11.12.15): the Wipe effect had no colours, so it showed
#   random ones; now the reply colour (dim red) with a moving dark gap.
# - Pilot light (2026.11.12.7): when idle, one LED (pilot_led) shows dim white
#   = on and ready, dim red = microphone muted. After the mute flash the ring
#   returns to the pilot instead of going dark.
# - Night mode controls the LEDs only (2026.11.12.8): "Night volume" removed;
#   the volume cap stacked with adaptive volume and disturbed its calibration.
# - Adaptive volume self-calibration (2026.11.11.1): the device measures its own
#   speech level at the mics (S) on voice replies. Echo cancellation separates
#   speaker from room (AFE input - AFE output), and the full-volume noise level
#   follows S. A reply that cannot be detected gives an upper limit for S, so a
#   too-high S always corrects itself. Needs "Echo Cancellation" on.
# - Adaptive volume UI: noise source fixed to the A-weighted AFE stream ("Ambient
#   noise source" select and the raw-mic estimator removed). Full-level noise
#   and max reduction are substitutions (-55 dBFS, 30 dB), no longer entities.
#   Sensors: "Room noise" (was "Ambient noise (A-weighted)"), "Speaker level"
#   (new), "Current volume" (was "Adaptive volume level").
#
# Audio / wake word
# - I2S clock: mic bus is now primary, speaker secondary (was ES8311 master).
#   Mic was mis-clocked until first playback -> micro_wake_word ring-buffer spam.
# - ES8311: stock ESPHome driver; custom external component (unpinned main) removed.
# - Removed use_apll / mclk_multiple / force_master; mic 16-bit like the codec.
# - Mixer + media pipeline mono: board has a single speaker.
# - ring_buffer_duration: 800ms added, commented out until ESPHome ships it.
#
# Gain
# - Gain factors (mww, VA) 1, reset at boot: digital gain amplifies noise and clips.
# - noise_suppression_level / auto_gain 0, sliders commented out: HA ignores them
#   for ESPHome satellites.
# - Mic gain (ES7210) 15 dB in 3 dB steps; saved value restored at boot.
#
# Features
# - Mic mute uses microphone.mute (0 dB gain was unity, not silence).
# - Mute-unmute sound switch now plays the mute/unmute sounds.
# - Play/Pause stops a ringing timer/alarm (works when muted).
# - Night mode: Night volume / Night LED brightness act as caps; day values
#   restored on exit. volume_min 0.4 -> 0.1, LED brightness min 0.4 -> 0.2.
#   volume_max 0.8 -> 1.0 for the audio-stack volume curve.
#
# LEDs
# - Pulse effects: update_interval > transition_length (16 ms flipped constantly).
# - rgb_order -> channel_colors (deprecated, removed in 2027.3).
#
# Cleanup / platform
# - play_sound takes the audio_file id as a string (since Sendspin, 2026.11.12.13).
# - min_version 2026.8.0 (channel_colors).
# - OTA uses encryption (API key) instead of a password.
# - Removed debug:, Current device time sensor + publish_current_time script.
# - Removed set_time_zone action, saved_time_zone, setenv/tzset: no effect since
#   ESPHome 2026.x; device follows HA's time zone.
# - Substitutions tidied (i2s_din/i2s_dout added, unused ones removed; i2c uses them).
# ==============================================================================

substitutions:
  device_name: esphome-va-1
  friendly: "Voice Assistant 1"
  # Firmware version, shown in HA (device info) and the ESPHome dashboard.
  # Bump on every change: year.month.day.build
  fw_version: "2026.11.12.15"

  # Phases of the Voice Assistant
  voice_assist_idle_phase_id: '1' # ready to be triggered by a wake word
  voice_assist_waiting_for_command_phase_id: '2' # waiting for a voice command (after being triggered by the wake word)
  voice_assist_listening_for_command_phase_id: '3' # listening for a voice command
  voice_assist_thinking_phase_id: '4' # processing the command
  voice_assist_replying_phase_id: '5' # replying to the command
  voice_assist_not_ready_phase_id: '10' # not ready
  voice_assist_error_phase_id: '11' # encountered an error

  i2s_mclk: GPIO12
  i2s_bclk: GPIO13  # SCLK
  i2s_lrclk: GPIO14 # LRCK/WS
  i2s_din: GPIO15  # ES7210 -> ESP (mic in)
  i2s_dout: GPIO16 # ESP -> ES8311 (speaker out)

  amp_ctrl: 8 # TCA9555 pin driving the amplifier PA_EN
  i2c_scl: GPIO10
  i2c_sda: GPIO11
  rtc_int: 5 # TCA9555 pin (RTC interrupt, unused)

  es7210_gain_db: "21.0" # mic ADC gain, fixed at boot; 3 dB steps (intercom profile uses 24)
  # Mic spacing 35 mm centre to centre (needed later for direction of arrival)
  # Front-end mic mode (build time; changing it needs Clean Build Files):
  #   "2" = both mics, echo cancellation + BSS (normal)
  #   "1" = right mic only, echo cancellation, no BSS (for comparison tests)
  afe_mic_num: "2"
  afe_dual: ${ afe_mic_num == "2" or afe_mic_num == 2 }
  afe_mic_slots: ${ [0, 2] if afe_dual else [0] }

  # Output offsets over the adapted volume for HA announcements (assist_satellite.announce,
  # including the pre-announcement chime), dB. Applied by lowering the adaptive
  # reduction, so the ceiling is 0 dB (no effect when the reduction is 0).
  # Chimes, TTS replies and timers/alarms get no offset.
  announcement_offset_db: "6"
  urgent_offset_db: "6"       # extra, for the next announcement after the set_announcement_offset action

  hidden_ssid: "false"
  led_num: '7' # WS2812 ring LEDs
  pilot_led: '0' # pilot light LED (0..6): first LED of the string, opposite the USB connector (6 is its neighbour)
  pilot_dim: '90' # pilot light level, 0..255 of the ring brightness

  # Files in this repository (sounds/, models/), pinned to a commit. After changing
  # a sound or model, push it and set repo_ref to that commit.
  repo_ref: b695c750df15741f3418079e8847e29922ee66ad
  repo_url: https://github.com/rgitha/esphome-waveshare-s3-audio-va/raw/${repo_ref}
  sounds_url: ${repo_url}/sounds
  # microWakeWord models (hey_jarvis, vad), pinned to a commit of esphome/micro-wake-word-models
  mww_models_url: https://github.com/esphome/micro-wake-word-models/raw/40ff33f57f8fc6ad71a75ef085abbf742495b225/models/v2
  boot_sound_file: ${sounds_url}/boot_chime.flac
  mute_sound_file: ${sounds_url}/mute_chime.flac
  unmute_sound_file: ${sounds_url}/unmute_chime.flac

# Pre-configured camera code
# exposes UI controls to Homeassistant
# ====================================
#packages: # REMOTE (GIT)
#  waveshare_camera_pkg: github://sw3Dan/waveshare-s2-audio_esphome_voice/waveshare_camera_pkg.yaml@main
#packages: # LOCAL FILE
#  dynamic-cam: !include
#    file: waveshare_camera_pkg.yaml

esphome:
  name: $device_name
  friendly_name: $friendly
  name_add_mac_suffix: false
  project:
    name: "rgitha.va-afe" # author.name, required format
    version: $fw_version
  comment: "AFE dual-mic, ${fw_version}"
  min_version: 2026.10.0 # esphome-audio-stack requirement (also covers channel_colors)
  on_boot:
    - priority: 375
      then:
        - sensor.template.publish:
            id: next_timer
            state: -1
        - script.execute: control_leds
        - delay: 10min
        - if:
            condition:
              lambda: return id(init_in_progress);
            then:
              - lambda: id(init_in_progress) = false;
              - script.execute: control_leds
    - priority: -100
      then:
        - lambda: |-
            id(alarm_time).publish_state(id(saved_alarm_time));
        - lambda: |-
            auto call = id(alarm_action).make_call();
            call.set_option(id(saved_alarm_action));
            call.perform();

esp32:
  board: esp32-s3-devkitc-1
  cpu_frequency: 240MHz
  variant: esp32s3
  flash_size: 16MB
  toolchain: esp-idf
  framework:
    type: esp-idf
    version: recommended
    advanced:
      compiler_optimization: PERF # AFE + wake word are CPU heavy
    sdkconfig_options:
      # Bounded Wi-Fi buffering (intercom board profile): media/TTS ingress sees
      # backpressure before the audio sink saturates.
      CONFIG_ESP_WIFI_STATIC_RX_BUFFER_NUM: "10"
      CONFIG_ESP_WIFI_DYNAMIC_RX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_DYNAMIC_TX_BUFFER_NUM: "32"
      CONFIG_ESP_WIFI_TX_BA_WIN: "16"
      CONFIG_ESP_WIFI_RX_BA_WIN: "16"
      CONFIG_ESP32S3_DATA_CACHE_64KB: "y"
      CONFIG_ESP32S3_DATA_CACHE_LINE_64B: "y"
      CONFIG_ESP32S3_INSTRUCTION_CACHE_32KB: "y"

      # Considerably speeds up mWW at the cost of using more PSRAM.
      CONFIG_SPIRAM_RODATA: "y"
      CONFIG_SPIRAM_FETCH_INSTRUCTIONS: "y"

      CONFIG_BT_ALLOCATION_FROM_SPIRAM_FIRST: "y"
      CONFIG_BT_BLE_DYNAMIC_ENV_MEMORY: "y"

      CONFIG_MBEDTLS_EXTERNAL_MEM_ALLOC: "y"
      CONFIG_MBEDTLS_SSL_PROTO_TLS1_3: "y"  # TLS1.3 support isn't enabled by default in IDF 5.1.5

network:
  # The speaker media player requests high-performance networking by default;
  # on this full-duplex audio profile that causes bursty ingress and memory pressure.
  enable_high_performance: false

wifi:
  id: wifi_id
  fast_connect: ${hidden_ssid}
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  power_save_mode: none  # Disable power saving for better performance
  reboot_timeout: 10min  # Prevent unnecessary reboots
  on_connect:
    - lambda: id(improv_ble_in_progress) = false;
    - script.execute: control_leds
  on_disconnect:
    - script.execute: control_leds

#network:
#  enable_ipv6: true

# Enable logging
logger:

api:
  id: api_id
  actions:
    - action: set_led_color
      variables:
        red: float
        green: float
        blue: float
      then:
        - lambda: |-
            id(led_ring_color_r) = std::min(1.0f, std::max(0.0f, red));
            id(led_ring_color_g) = std::min(1.0f, std::max(0.0f, green));
            id(led_ring_color_b) = std::min(1.0f, std::max(0.0f, blue));
    - action: start_va
      then:
        - voice_assistant.start
    - action: stop_va
      then:
        - voice_assistant.stop
    - action: set_alarm_time
      variables:
        alarm_time_hh_mm: string
      then:
        - lambda: |-
            if (alarm_time_hh_mm.length() == 5 &&
              isdigit(alarm_time_hh_mm[0]) && isdigit(alarm_time_hh_mm[1]) &&
              isdigit(alarm_time_hh_mm[3]) && isdigit(alarm_time_hh_mm[4])) {
                id(alarm_time).publish_state(alarm_time_hh_mm);
                id(saved_alarm_time) = alarm_time_hh_mm;
              }
    # Urgent announcement: call just before assist_satellite.announce; the
    # next HA announcement within 10 s gets
    # urgent_offset_db on top of announcement_offset_db.
    - action: set_announcement_offset
      then:
        - lambda: |-
            id(urgent_pending) = true;
            id(urgent_set_ms) = millis();
  on_client_connected:
    - script.execute: control_leds
  on_client_disconnected:
    - script.execute: control_leds

  encryption:
    key: !secret api_key_esp32_audio_board

#http_request:
#  verify_ssl: false
#  buffer_size_rx: 2048  # Reduces CPU load when streaming audio

ota:
  - platform: esphome
    id: ota_esphome
    encryption: # uses the api: encryption key

i2c:
  - id: internal_i2c
    sda: $i2c_sda
    scl: $i2c_scl
    scan: true
    frequency: 100kHz

# I/O Expander that controls the amplifier enable pin
tca9555:
  id: ioexp
  i2c_id: internal_i2c
  address: 0x20

psram:
  mode: octal
  speed: 80MHz

time:
  - platform: homeassistant
    id: rtc
    # No timezone: here on purpose -> the device follows Home Assistant's time zone,
    # which HA (2026.3+) sends with every time sync.
    on_time:
      - seconds: 0
        minutes: /1
        then:
          - script.execute: check_alarm
  # Alternative: on-board PCF85063 RTC (RTC_INT on TCA9555 pin $rtc_int)
  #- platform: pcf85063
  #  id: rtc
  #  address: 0x51
  #  i2c_id: internal_i2c

light:
  - platform: esp32_rmt_led_strip
    id: status_ring
    pin: GPIO38
    num_leds: ${led_num}
    chipset: WS2812
    channel_colors: RGB
    default_transition_length: 150ms
    effects:
      # Pilot light: one LED (opposite the USB connector) in the light's colour,
      # dimmed here (RGB is normalised to full scale, so dim in the effect)
      - addressable_lambda:
          name: "Pilot"
          update_interval: 1s
          lambda: |-
            it.all() = Color::BLACK;
            it[${pilot_led}] = current_color * ${pilot_dim};
      - pulse:
          name: "Pulse Slow"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 2000ms
          update_interval: 3000ms
      - pulse:
          name: "Pulse Medium"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 600ms
          update_interval: 1200ms
      - pulse:
          name: "Pulse Fast"
          min_brightness: 30%
          max_brightness: 100%
          transition_length: 300ms
          update_interval: 600ms
      - addressable_rainbow:
          name: "Rainbow Slow"
          speed: 4
          width: 7
      # Reply: a colour wipe ignores the light's colour (default is random
      # colours), so the reply colour is set here: 4 lit, 3 dark, moving.
      - addressable_color_wipe:
          name: "Wipe"
          add_led_interval: 100ms
          colors:
            - red: 60%
              green: 10%
              blue: 10%
              num_leds: 4
            - red: 0%
              green: 0%
              blue: 0%
              num_leds: 3

external_components:
  # v2026.11.0, pinned by commit
  - source: github://n-IA-hane/esphome-audio-stack@3787f502d19cfd181df92fee2a920857ef71abcf
    components: [esp_audio_stack, esp_afe]
  # v0.2.0 (in development), pinned by commit
  - source: github://rgitha/esphome-adaptive-volume@17194905b02aceaf282dae386c71a6033882c1d5
    components: [adaptive_volume]

# Audio hardware: one shared I2S bus in 4-slot TDM at 48 kHz.
# ES7210 slots: 0 = right mic, 2 = left mic, 1 = ES8311 playback reference, 3 = unused
# (board oriented speaker down, GPIO header up). Mic audio goes through the AFE
# and comes out as one processed 16 kHz mono stream.
esp_audio_stack:
  id: audio_stack
  i2s_mclk_pin: $i2s_mclk
  i2s_bclk_pin: $i2s_bclk
  i2s_lrclk_pin: $i2s_lrclk
  i2s_din_pin: $i2s_din
  i2s_dout_pin: $i2s_dout
  sample_rate: 48000
  output_sample_rate: 16000
  processor_id: afe_processor
  # Task placement and PSRAM buffers from the board-tested intercom profile
  task_core: 1
  task_priority: 19
  task_stack_size: 8192
  audio_task_stack_in_psram: true
  buffers_in_psram: true
  # Master volume = ES8311 hardware volume, used only by adaptive volume.
  # -40 dB floor allows up to ~39 dB of adaptive reduction (was -30).
  master_volume_min_db: -40.0
  audio_effects:
    rate_cvt_complexity: 3
    rate_cvt_perf_type: speed
  codec:
    i2c_id: internal_i2c
    input:
      type: es7210
      address: 0x40
      mic_selected: 0x0F
      gain_db: $es7210_gain_db
    output:
      type: es8311
      address: 0x18
      use_mclk: true
      no_dac_ref: true
  use_tdm_reference: true
  tdm_total_slots: 4
  tdm_mic_slots: ${afe_mic_slots} # [0, 2] = right mic, left mic; [0] = right mic only
  tdm_ref_slot: 1       # playback reference for echo cancellation

# Espressif audio front end: echo cancellation + dual-mic BSS (+ VAD).
# Notes from the intercom profile: AGC causes TTS/media stutter on this board;
# AEC off with dual-mic BSS sounds metallic. NS is superseded by BSS on 2 mics.
esp_afe:
  id: afe_processor
  type: sr            # speech recognition: linear AEC, keeps the spectrum intact for
                      # wake word / STT. "fd" (intercom default) adds nonlinear
                      # processing for two-way calls and lowered STT accuracy here.
  mode: high_perf
  mic_num: ${afe_mic_num}  # see the afe_mic_num substitution
  se_enabled: ${afe_dual}  # dual-mic speech enhancement (BSS); BSS cannot be toggled at runtime
  aec_filter_length: 4
  aec_nlp_level: normal # only used by vc/fd types
  ns_enabled: false   # no effect with 2 mics (BSS takes precedence); off so 1-mic tests compare like for like
  vad_enabled: true
  continuous_vad: true
  agc_enabled: false
  memory_alloc_mode: more_psram
  task_core: 1
  task_priority: 5
  ringbuf_size: 8
  feed_task_core: 0
  feed_task_priority: 5
  feed_task_stack_size: 3072
  fetch_task_core: 1
  fetch_task_priority: 5
  fetch_task_stack_size: 3072
  feed_buf_in_psram: true
  feed_ring_in_psram: true
  fetch_ring_in_psram: true

# Adaptive volume (component: github.com/rgitha/esphome-adaptive-volume).
# In a quiet room all sound is turned down via the codec master volume; the HA
# volume slider is the level in a loud room and never moves. The device
# calibrates itself on its own spoken replies (speaker level S).
# Attenuation A = clamp(S - room noise - (loudness_constant + offset), 0, max).
adaptive_volume:
  id: adaptive
  esp_audio_stack_id: audio_stack
  media_player: external_media_player
  # The device makes no sound: the room may be measured
  idle: |-
    return id(voice_assistant_phase) == ${voice_assist_idle_phase_id} &&
           id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_IDLE &&
           !id(timer_ringing).state && !id(mic_is_muted);
  # A spoken reply to a voice command is playing
  reply: |-
    return id(va_run_active) && id(voice_assistant_phase) == ${voice_assist_replying_phase_id} &&
           id(external_media_player).state == media_player::MEDIA_PLAYER_STATE_ANNOUNCING;
  # Output muted or amplifier off: a reply measured now is not counted
  blocked: |-
    return id(external_media_player).is_muted() || id(mic_is_muted) || !id(amp_enable_8).state;
  speaker_level_nominal: -30   # S before the first measured reply (this hardware, A-weighted)
  loudness_constant: 20        # dB above room noise at the mics, at full slider
  max_attenuation: 30
  master_volume_min_db: -40    # = esp_audio_stack master_volume_min_db
  media_volume_min: 0.1        # = media player volume_min
  enable:
    name: Adaptive volume
    entity_category: config
  offset:
    name: Adaptive volume offset
    mode: slider
  room_noise:
    name: Room noise
  speaker_level:
    name: Speaker level
  speaker_level_reply:
    name: Speaker level (last reply)
    disabled_by_default: true # calibration tuning only
  attenuation:
    name: Adaptive volume reduction
  current_volume:
    name: Current volume

microphone:
  - platform: esp_audio_stack
    id: afe_mic

speaker:
  - platform: esp_audio_stack
    id: hw_speaker
    sample_rate: 48000
    bits_per_sample: 16
    timeout: never
    # Short hardware backlog so backpressure reaches media/TTS quickly (full duplex)
    buffer_duration: 128ms

  # Virtual speakers to combine the announcement and media streams together into one output
  - platform: mixer
    id: mixing_speaker
    output_speaker: hw_speaker
    num_channels: 1 # board has a single (mono) speaker
    source_speakers:
      - id: announcement_mixing_input
        timeout: never
      - id: media_mixing_input
        timeout: never

  # Virtual speakers to resample each pipelines' audio, if necessary, as the mixer speaker requires the same sample rate
  - platform: resampler
    id: announcement_resampling_speaker
    output_speaker: announcement_mixing_input
  - platform: resampler
    id: media_resampling_speaker
    output_speaker: media_mixing_input

sendspin:
  id: sendspin_hub
  task_stack_in_psram: false

audio_file:
  - id: mute_switch_on_sound
    file: ${mute_sound_file}
  - id: mute_switch_off_sound
    file: ${unmute_sound_file}
  - id: boot_sound
    file: ${boot_sound_file}
  - id: timer_finished_sound
    file: ${sounds_url}/timer_finished.flac
  - id: wake_word_triggered_sound
    file: ${sounds_url}/wake_word_triggered.flac
  - id: error_cloud_expired
    file: ${sounds_url}/error_cloud_expired.mp3

media_source:
  - platform: audio_file
    id: audio_file_announcement_source
  - platform: audio_http
    id: http_announcement_source
    buffer_size: 250000
  - platform: audio_http
    id: http_media_source
    buffer_size: 500000
  - platform: sendspin
    id: sendspin_media_source
    codecs: [FLAC, PCM]  # Prefer FLAC for Sendspin
    # DAC delay for sync: unknown for the ES8311 behind the audio stack (Voice PE: 480 us).
    # Adjustable lets the Sendspin server (Music Assistant) set and keep a per-player delay.
    static_delay_adjustable: true

media_player:
  # Sendspin group control (volume/mute of the whole group)
  - platform: sendspin
    id: sendspin_group_media_player
  - platform: speaker_source
    id: external_media_player
    name: None
    internal: False
    volume_increment: 0.01
    volume_initial: 0.85 # first boot only; afterwards the last volume is restored
    volume_min: 0.1 # wider quiet end (was 0.4)
    volume_max: 1.0 # audio-stack volume curve tops out at 0 dB (stock ES8311 driver reached about +6.5 dB at 0.8)
    announcement_pipeline:
      speaker: announcement_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # Stereo audio is unnecessary for announcements
      sample_rate: 48000 # supported by Music Assistant
      sources:
        - audio_file_announcement_source
        - http_announcement_source
    media_pipeline:
      speaker: media_resampling_speaker
      format: FLAC     # FLAC is the least processor intensive codec
      num_channels: 1  # mono hardware, one speaker
      sample_rate: 48000
      sources:
        - http_media_source
        - sendspin_media_source
    on_announcement:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 10
          duration: 0.0s
    on_state:
      if:
        condition:
          and:
            - switch.is_off: timer_ringing
            - not:
                voice_assistant.is_running:
            - not:
                media_player.is_announcing: external_media_player
        then:
          - mixer_speaker.apply_ducking:
              id: media_mixing_input
              decibel_reduction: 0
              duration: 1.0s
    on_mute:
      - delay: 100ms  # Debounce
      - script.execute: control_leds_volume_changed
    on_unmute:
      - delay: 100ms  # Debounce
      - script.execute: control_leds_volume_changed
    on_volume:
      - if:
          condition:
            - lambda: return !id(init_in_progress);
          then:
            - delay: 100ms  # Debounce
            - script.execute: control_leds_volume_changed

micro_wake_word:
  id: mww
  # Larger audio buffer to absorb brief inference delays (default 120 ms).
  # Uncomment once your ESPHome release supports it (esphome/esphome PR #20942,
  # merged to dev 2026-10-18; not in 2026.9 / 2026.10).
  # ring_buffer_duration: 800ms
  microphone:
    id: mww_mic
    microphone: afe_mic # AFE output is mono, so no channel selection
    gain_factor: 1 # digital gain; use the Mic Gain trim instead
  task_stack_in_psram: true
  stop_after_detection: false
  models:
    - model: https://github.com/kahrendt/microWakeWord/releases/download/okay_nabu_20241226.3/okay_nabu.json
      id: okay_nabu
    #- model: https://raw.githubusercontent.com/formatBCE/Respeaker-Lite-ESPHome-integration/refs/heads/main/microwakeword/models/v2/kenobi.json
    #  id: kenobi
    - model: ${mww_models_url}/hey_jarvis.json
      id: hey_jarvis
    #- model: hey_mycroft
    #  id: hey_mycroft
    - model: ${repo_url}/models/stop.json # beta 20241017.5 (release "stop")
      id: stop
      internal: true
      probability_cutoff: 0.75 # model default 0.50 false-triggered on residual TTS echo
  vad:
    model: ${mww_models_url}/vad.json
    probability_cutoff: 0.2
  on_wake_word_detected:
    # If the wake word is detected when the device is muted (Possible with the software mute switch): Do nothing
    - if:
        condition:
          switch.is_off: mic_mute_switch
        then:
          # If a timer is ringing: Stop it, do not start the voice assistant (We can stop timer from voice!)
          - if:
              condition:
                switch.is_on: timer_ringing
              then:
                - switch.turn_off: timer_ringing
              # Stop voice assistant if running
              else:
                - if:
                    condition:
                      voice_assistant.is_running:
                    then:
                      voice_assistant.stop:
                    # Stop any other media player announcement
                    else:
                      - if:
                          condition:
                            media_player.is_announcing: external_media_player
                          then:
                            - media_player.stop:
                                id: external_media_player
                                announcement: true
                          # Start the voice assistant and play the wake sound, if enabled
                          else:
                            - if:
                                condition:
                                  switch.is_on: wake_sound
                                then:
                                  - script.execute:
                                      id: play_sound
                                      priority: true
                                      sound_file: "wake_word_triggered_sound"
                                  - delay: 300ms
                            - voice_assistant.start:
                                wake_word: !lambda return wake_word;

voice_assistant:
  id: va
  microphone:
    microphone: afe_mic
    id: va_mic
    gain_factor: 1  # digital gain; use the Mic Gain trim instead. Live-adjustable from HA until reboot.
    # Not applicable in this file: the AFE output is mono, so there is no channel
    # to select. Kept from the single-mic baseline for reference:
    #channels: 1 #Right
    #channels: 0 #Left
    # Using diff channel from mww so that some gain settings can apply properly?
    # https://github.com/esphome/esphome/pull/8645 Apr 2025
    # (That PR lets each consumer pick its own channel and gain_factor from one mic.)
  media_player: external_media_player
  micro_wake_word: mww
  use_wake_word: false
  # Home Assistant currently ignores these for ESPHome satellites (it always runs
  # with noise suppression 0 / auto gain 0), so keep them at 0 to match reality.
  noise_suppression_level: 0
  auto_gain: 0dBFS
  volume_multiplier: 1
  on_client_connected:
    - if:
        condition:
          - lambda: return id(init_in_progress);
          - switch.is_on: mic_mute_switch
        then:
          - switch.turn_off: mic_mute_switch
    # Boot sound: once per boot, on the first connection to HA; not in night mode
    - if:
        condition:
          and:
            - lambda: return id(init_in_progress);
            - switch.is_off: night_mode
        then:
          - script.execute:
              id: play_sound
              priority: false
              sound_file: "boot_sound"
    - lambda: id(init_in_progress) = false;
    - micro_wake_word.start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
    - script.execute: control_leds
  on_client_disconnected:
    - voice_assistant.stop:
    - lambda: id(voice_assistant_phase) = ${voice_assist_not_ready_phase_id};
    - script.execute: control_leds
  on_error:
    # Only set the error phase if the error code is different than duplicate_wake_up_detected or stt-no-text-recognized
    # These two are ignored for a better user experience
    - if:
        condition:
          and:
            - lambda: return !id(init_in_progress);
            - lambda: return code != "duplicate_wake_up_detected";
            - lambda: return code != "stt-no-text-recognized";
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_error_phase_id};
          - script.execute: control_leds
    # If the error code is cloud-auth-failed, serve a local audio file guiding the user.
    - if:
        condition:
          - lambda: return code == "cloud-auth-failed";
        then:
          - script.execute:
              id: play_sound
              priority: true
              sound_file: "error_cloud_expired"
  # When the voice assistant starts: Play a wake up sound, duck audio.
  on_start:
    # A run (wake word, start_va, or a conversation continued after an
    # announcement): its TTS reply gets no output offset.
    - lambda: |-
        id(va_run_active) = true;
        id(adaptive).set_announcement_offset(0);
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 10 # dB quieter; 0 = full volume
        duration: 0.0s         # The duration of the transition (default is no transition)
  on_listening:
    - lambda: id(voice_assistant_phase) = ${voice_assist_waiting_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_start:
    - lambda: id(voice_assistant_phase) = ${voice_assist_listening_for_command_phase_id};
    - script.execute: control_leds
  on_stt_vad_end:
    - lambda: id(voice_assistant_phase) = ${voice_assist_thinking_phase_id};
    - script.execute: control_leds
  on_intent_progress:
    - if:
        condition:
          # A nonempty x variable means a streaming TTS url was sent to the media player
          lambda: 'return !x.empty();'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_start:
    # TTS without a run = HA announcement (assist_satellite.announce): output
    # offset until on_end, plus the urgent offset if set_announcement_offset
    # was called in the last 10 s.
    - lambda: |-
        if (!id(va_run_active)) {
          float boost = ${announcement_offset_db};
          if (id(urgent_pending) && millis() - id(urgent_set_ms) < 10000) boost += ${urgent_offset_db};
          id(urgent_pending) = false;
          id(adaptive).set_announcement_offset(boost);
        }
    - if:
        condition:
          # The intent_progress trigger didn't start the TTS response
          lambda: 'return id(voice_assistant_phase) != ${voice_assist_replying_phase_id};'
        then:
          - lambda: id(voice_assistant_phase) = ${voice_assist_replying_phase_id};
          - script.execute: control_leds
          # Start a script that would potentially enable the stop word if the response is longer than a second
          - script.execute: activate_stop_word_once
  on_tts_end:
    - script.execute:
        id: send_tts_uri_event
        tts_uri: !lambda 'return x;'
  on_stt_end:
    - script.execute:
        id: send_stt_text_event
        stt_text: !lambda 'return x;'

  # When the voice assistant ends ...
  on_end:
    - wait_until:
        not:
          voice_assistant.is_running:
    # Stop ducking audio.
    - mixer_speaker.apply_ducking:
        id: media_mixing_input
        decibel_reduction: 0
        duration: 1.0s
    # If the end happened because of an error, let the error phase on for a second
    - if:
        condition:
          lambda: return id(voice_assistant_phase) == ${voice_assist_error_phase_id};
        then:
          - delay: 1s
    # Reset the voice assistant phase id and reset the LED animations.
    - lambda: |-
        id(voice_assistant_phase) = ${voice_assist_idle_phase_id};
        id(va_run_active) = false;
        id(adaptive).set_announcement_offset(0);  // announcement finished
    - script.execute: control_leds
  on_timer_finished:
    - switch.turn_on: timer_ringing
    - lambda: |
        id(next_timer).publish_state(-1);
        id(next_timer_name).publish_state("-");
  on_timer_started:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_cancelled:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        } else {
          id(next_timer).publish_state(-1);
          id(next_timer_name).publish_state("-");
        }
    - script.execute: control_leds
  on_timer_updated:
    - lambda: |
        id(check_if_timers_active).execute();
        if (id(is_timer_active)) {
          id(fetch_first_active_timer).execute();
          id(next_timer).publish_state(id(first_active_timer).seconds_left);
          id(next_timer_name).publish_state(id(first_active_timer).name);
        }
    - script.execute: control_leds
  on_timer_tick:
    - lambda: |
        id(fetch_first_active_timer).execute();
        int seconds_left = id(first_active_timer).seconds_left;
        if (seconds_left % 5 == 0) {
          id(next_timer).publish_state(seconds_left);
        }
        // LED updates are handled centrally by control_leds()

globals:
  - id: mic_is_muted
    type: bool
    restore_value: yes
    initial_value: 'false'

  - id: led_ring_color_r
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: led_ring_color_g
    type: float
    restore_value: yes
    initial_value: '0.0'
  - id: led_ring_color_b
    type: float
    restore_value: yes
    initial_value: '1.0'
  - id: init_in_progress
    type: bool
    restore_value: no
    initial_value: 'true'
  - id: improv_ble_in_progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: voice_assistant_phase
    type: int
    restore_value: no
    initial_value: ${voice_assist_not_ready_phase_id}
  - id: saved_alarm_time
    type: std::string
    restore_value: yes
    initial_value: '"Unknown"'
  - id: saved_alarm_action
    type: std::string
    restore_value: yes
    initial_value: '"Play sound"'
  - id: first_active_timer
    type: voice_assistant::Timer
    restore_value: no
  - id: is_timer_active
    type: bool
    restore_value: no
  - id: factory_reset_requested
    type: bool
    restore_value: no
    initial_value: 'false'
  # Night mode state; restored so a reboot during the night keeps the day values
  - id: night_active
    type: bool
    restore_value: yes
    initial_value: 'false'
  - id: day_led_brightness
    type: float
    restore_value: yes
    initial_value: '0.8'
  - id: va_run_active # a voice assistant run (wake word / start_va) is in progress
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: urgent_pending # set by the set_announcement_offset action
    type: bool
    restore_value: no
    initial_value: 'false'
  - id: urgent_set_ms
    type: uint32_t
    restore_value: no
    initial_value: '0'

script:
  - id: night_mode_enter
    mode: queued
    then:
      - if:
          condition:
            lambda: return !id(night_active); # already in night mode (e.g. restored at boot): keep saved day values
          then:
            - lambda: |-
                id(day_led_brightness) = id(led_ring_brightness).state;
                id(night_active) = true;
                ESP_LOGI("night", "Night on: saved day brightness %.2f", id(day_led_brightness));
            - if:
                condition:
                  lambda: return id(led_ring_brightness).state > id(night_led_brightness).state;
                then:
                  - number.set:
                      id: led_ring_brightness
                      value: !lambda return id(night_led_brightness).state;

  - id: night_mode_exit
    mode: queued
    then:
      - if:
          condition:
            lambda: return id(night_active);
          then:
            - lambda: |-
                id(night_active) = false;
                ESP_LOGI("night", "Night off: restoring day brightness %.2f", id(day_led_brightness));
            - number.set:
                id: led_ring_brightness
                value: !lambda return id(day_led_brightness);

  # Short flash of the ring: red = microphone muted, green = unmuted
  - id: flash_ring
    parameters:
      muted: bool
    then:
      - light.turn_on:
          id: status_ring
          red: !lambda 'return muted ? 1.0f : 0.0f;'
          green: !lambda 'return muted ? 0.0f : 1.0f;'
          blue: 0.0
          brightness: 100%
          effect: None # full ring (without it the running Pilot effect stays)
      - delay: 250ms
      - script.execute: control_leds # back to the pilot light (red while muted)

  # Minimal dispatcher for LEDs: off / solid / built-in effects
  - id: led_set_effect
    mode: restart
    parameters:
      effect: std::string
      r: float
      g: float
      b: float
    then:
      - lambda: |-
          id(led_ring_color_r) = r;
          id(led_ring_color_g) = g;
          id(led_ring_color_b) = b;
          ESP_LOGI("led", "led_set_effect: effect='%s' rgb(%.2f, %.2f, %.2f) brightness=%.2f",
                   effect.c_str(), r, g, b, (float) id(led_ring_brightness).state);
      - if:
          condition:
            lambda: 'return effect == "off";'
          then:
            - light.turn_off: status_ring
          else:
            - if:
                condition:
                  lambda: 'return effect == "solid";'
                then:
                  - light.turn_on:
                      id: status_ring
                      brightness: !lambda 'return id(led_ring_brightness).state;'
                      red: !lambda 'return id(led_ring_color_r);'
                      green: !lambda 'return id(led_ring_color_g);'
                      blue: !lambda 'return id(led_ring_color_b);'
                      effect: None # full ring: clear any running effect (Pilot)
                else:
                  - light.turn_on:
                      id: status_ring
                      brightness: !lambda 'return id(led_ring_brightness).state;'
                      red: !lambda 'return id(led_ring_color_r);'
                      green: !lambda 'return id(led_ring_color_g);'
                      blue: !lambda 'return id(led_ring_color_b);'
                      effect: !lambda 'return effect;'

  # Single LED state machine (small footprint)
  - id: control_leds
    mode: single
    then:
      - lambda: |-
          const bool wifi_connected = id(wifi_id).is_connected();
          const bool api_connected  = id(api_id).is_connected();
          const bool ringing        = id(timer_ringing).state;
          const bool improv_ble     = id(improv_ble_in_progress);
          const bool init_progress  = id(init_in_progress);
          const int  phase          = id(voice_assistant_phase);

          // Refresh timer cache sparsely when needed
          id(check_if_timers_active).execute();
          const bool timers_active = id(is_timer_active);

          ESP_LOGD("led",
                   "control_leds: wifi=%d api=%d improv=%d init=%d ringing=%d timers_active=%d phase=%d",
                   (int)wifi_connected, (int)api_connected, (int)improv_ble, (int)init_progress,
                   (int)ringing, (int)timers_active, phase);

          auto set = [&](const char* effect, float r, float g, float b) {
            id(led_set_effect).execute(effect, r, g, b);
          };

          if (improv_ble) {                          // Provisioning
            set("Pulse Medium", 1.0, 0.89, 0.71);    // warm white
            return;
          }
          if (init_progress) {                       // Boot/init
            if (wifi_connected) set("Rainbow Slow", 0.9, 0.1, 0.85); else set("Rainbow Slow", 1.0, 0.1, 0.1);
            return;
          }
          if (!wifi_connected || !api_connected) {   // HA disconnected
            set("Pulse Medium", 1.0, 0.0, 0.0);
            return;
          }
          if (ringing) {                             // Timer ringing
            set("Pulse Fast", 0.6, 0.0, 0.6);
            return;
          }

          // Voice assistant phases
          switch (phase) {
            case ${voice_assist_waiting_for_command_phase_id}: // just woke
              set("solid", 0.5, 0.0, 0.5);  // calm solid violet
              return;
            case ${voice_assist_listening_for_command_phase_id}:
              set("Pulse Medium", 0.3, 0.0, 0.8);
              return;
            case ${voice_assist_thinking_phase_id}:
              set("Pulse Slow", 0.6, 0.3, 0.1);
              return;
            case ${voice_assist_replying_phase_id}:
              set("Wipe", 0.6, 0.1, 0.1);  // colour set in the Wipe effect
              return;
            case ${voice_assist_error_phase_id}:
              set("Pulse Fast", 1.0, 0.0, 0.0);
              return;
            case ${voice_assist_not_ready_phase_id}:
              set("Pulse Slow", 1.0, 0.0, 0.0);
              return;
            default: break;
          }

          // Timers ticking (no bar, minimal footprint)
          if (timers_active) {
            set("Pulse Slow", 0.6, 0.0, 0.8);
            return;
          }

          // Idle: pilot LED, dim red while the microphone is muted, else dim white
          if (id(mic_is_muted)) set("Pilot", 1.0, 0.0, 0.0);
          else set("Pilot", 1.0, 1.0, 1.0);

  # Brief green pulse when volume changes, then restore
  - id: control_leds_volume_changed
    mode: restart
    then:
      - light.turn_on:
          id: status_ring
          brightness: !lambda 'return id(led_ring_brightness).state;'
          red: 0.0
          green: 0.5
          blue: 0.3
          effect: "Pulse Fast"
      - lambda: |-
          ESP_LOGD("led", "volume_changed: flash green");
      - delay: 1.2s
      - script.execute: control_leds

  # Timer sound handling
  - id: ring_timer
    then:
      - script.execute: enable_repeat_one
      - script.execute:
          id: play_sound
          priority: true
          sound_file: "timer_finished_sound"

  - id: enable_repeat_one
    then:
      - media_player.repeat_one:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 500ms

  - id: disable_repeat
    then:
      - media_player.repeat_off:
          id: external_media_player
          announcement: true
      - speaker_source.set_playlist_delay:
          id: external_media_player
          pipeline: announcement
          delay: 0ms

  - id: play_sound
    parameters:
      priority: bool
      sound_file: string  # id of an audio_file entry
    then:
      - lambda: |-
          if (priority) {
            id(external_media_player)
              ->make_call()
              .set_command(media_player::MediaPlayerCommand::MEDIA_PLAYER_COMMAND_STOP)
              .set_announcement(true)
              .perform();
          }
          if ((id(external_media_player).state != media_player::MediaPlayerState::MEDIA_PLAYER_STATE_ANNOUNCING) || priority) {
            id(external_media_player)
              ->make_call()
              .set_media_url("audio-file://" + sound_file)
              .set_announcement(true)
              .perform();
          }

  # Timer helpers
  - id: fetch_first_active_timer
    mode: single
    then:
      - lambda: |
          static uint32_t last_fetch_time = 0;
          uint32_t now = millis();
          if (now - last_fetch_time < 500) return;
          last_fetch_time = now;

          const auto &timers = id(va).get_timers();
          if (timers.empty()) return;

          auto output_timer = *timers.begin();
          for (const auto &timer : timers) {
            if (timer.is_active && timer.seconds_left <= output_timer.seconds_left) {
              output_timer = timer;

              }
          }
          id(first_active_timer) = output_timer;

  - id: check_if_timers_active
    then:
      - lambda: |
          const auto &timers = id(va).get_timers();
          bool output = false;
          if (!timers.empty()) {
            for (const auto &timer : timers) {
              if (timer.is_active) {
                output = true;
                break;
              }
            }
          }
          id(is_timer_active) = output;

  # Enable/disable the "stop" wake word around long TTS
  - id: activate_stop_word_once
    then:
      # Wait for the reply to actually start playing: a streamed TTS reply can
      # start more than 1 s later, and "not announcing" below would then switch
      # "stop" off before the reply begins (Voice PE fix #512).
      - wait_until:
          condition:
            media_player.is_announcing:
              id: external_media_player
          timeout: 5s
      - delay: 1s
      - if:
          condition:
            switch.is_off: timer_ringing
          then:
            - micro_wake_word.enable_model: stop
            - wait_until:
                not:
                  media_player.is_announcing: external_media_player
            - if:
                condition:
                  switch.is_off: timer_ringing
                then:
                  - micro_wake_word.disable_model: stop

  # Alarm handling
  - id: check_alarm
    then:
      - lambda: |-
          if (id(alarm_on).state && id(alarm_time).has_state()) {
            auto set_alarm_time = id(alarm_time).state;
            if (set_alarm_time.length() == 5 &&
                isdigit(set_alarm_time[0]) && isdigit(set_alarm_time[1]) &&
                isdigit(set_alarm_time[3]) && isdigit(set_alarm_time[4])) {
              auto alarm_hour = std::stoi(set_alarm_time.substr(0, 2));
              auto alarm_minute = std::stoi(set_alarm_time.substr(3, 2));

              auto time_now = id(rtc).now();
              if (time_now.hour == alarm_hour && time_now.minute == alarm_minute) {
                auto action = id(alarm_action).current_option();
                if (action == "Play sound") {
                  id(timer_ringing).turn_on();
                } else if (action == "Send event") {
                  id(send_alarm_event).execute();
                } else if (action == "Sound and event") {
                  id(timer_ringing).turn_on();
                  id(send_alarm_event).execute();
                }
              }
            } else {
              ESP_LOGW("alarm", "Incorrect alarm time setting");
            }
          }

  - id: send_alarm_event
    then:
      - homeassistant.event:
          event: esphome.alarm_ringing

  - id: send_tts_uri_event
    parameters:
      tts_uri: string
    then:
      - homeassistant.event:
          event: esphome.tts_uri
          data:
            uri: !lambda return tts_uri;

  - id: send_stt_text_event
    parameters:
      stt_text: string
    then:
      - homeassistant.event:
          event: esphome.stt_text
          data:
            text: !lambda return stt_text;

select:
  - platform: template
    name: "Wake word sensitivity"
    optimistic: true
    initial_option: Slightly sensitive
    restore_value: true
    entity_category: config
    options:
      - Slightly sensitive
      - Moderately sensitive
      - Very sensitive
    on_value:
      # Sets specific wake word probabilities computed for each particular model
      # Note probability cutoffs are set as a quantized uint8 value, each comment has the corresponding floating point cutoff
      # False Accepts per Hour values are tested against all units and channels from the Dinner Party Corpus.
      # These cutoffs apply only to the specific models included in the firmware: okay_nabu@20241226.3, hey_jarvis@v2, hey_mycroft@v2
      lambda: |-
        if (x == "Slightly sensitive") {
          id(okay_nabu).set_probability_cutoff(217);    // 0.85 -> 0.000 FAPH on DipCo (Manifest's default)
          //id(hey_jarvis).set_probability_cutoff(247);   // 0.97 -> 0.563 FAPH on DipCo (Manifest's default)
          id(hey_jarvis).set_probability_cutoff(247);
          //id(hey_mycroft).set_probability_cutoff(253);  // 0.99 -> 0.567 FAPH on DipCo
        } else if (x == "Moderately sensitive") {
          id(okay_nabu).set_probability_cutoff(176);    // 0.69 -> 0.376 FAPH on DipCo
          //id(hey_jarvis).set_probability_cutoff(235);   // 0.92 -> 0.939 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(200);
          //id(hey_mycroft).set_probability_cutoff(242);  // 0.95 -> 1.502 FAPH on DipCo (Manifest's default)
        } else if (x == "Very sensitive") {
          id(okay_nabu).set_probability_cutoff(50);
          //id(okay_nabu).set_probability_cutoff(143);    // 0.56 -> 0.751 FAPH on DipCo
          //id(hey_jarvis).set_probability_cutoff(212);   // 0.83 -> 1.502 FAPH on DipCo
          id(hey_jarvis).set_probability_cutoff(100);
          //id(hey_mycroft).set_probability_cutoff(237);  // 0.93 -> 1.878 FAPH on DipCo
        }
  - platform: logger
    id: logger_select
    name: Logger Level
    disabled_by_default: true
  - platform: template
    optimistic: true
    name: "Alarm action"
    id: alarm_action
    entity_category: config
    icon: mdi:bell-plus
    options:
      - "Play sound"
      - "Send event"
      - "Sound and event"
    initial_option: "Play sound"
    on_value:
      then:
        - lambda: |-
            id(saved_alarm_action) = x;

switch:
  # Echo cancellation on/off for A/B testing (keep on for normal use). The
  # speaker level calibration needs it on; while off, calibration pauses.
  - platform: esp_afe
    esp_afe_id: afe_processor
    aec:
      id: aec_switch
      name: Echo Cancellation
      icon: mdi:ear-hearing
      restore_mode: RESTORE_DEFAULT_ON
      entity_category: config

  - platform: gpio
    id: amp_enable_8
    name: Amplifier
    icon: mdi:speaker
    entity_category: config
    disabled_by_default: true # off just silences the device
    pin:
      tca9555: ioexp
      number: $amp_ctrl
      inverted: false
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: mic_mute_switch
    name: "Microphone Mute"
    icon: mdi:microphone-off
    restore_mode: RESTORE_DEFAULT_OFF
    lambda: |-
      return id(mic_is_muted);
    # Real mute: every consumer (wake word, VA) receives silence.
    # (0 dB ES7210 gain is unity gain, not silence.)
    turn_on_action:
      - lambda: id(mic_is_muted) = true;
      - microphone.mute: afe_mic
      - script.execute:
          id: flash_ring
          muted: true
      - if:
          condition:
            and:
              - switch.is_on: mute_sound
              - lambda: return !id(init_in_progress); # no sound for the automatic unmute at boot
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_on_sound"
    turn_off_action:
      - lambda: id(mic_is_muted) = false;
      - microphone.unmute: afe_mic
      - script.execute:
          id: flash_ring
          muted: false
      - if:
          condition:
            and:
              - switch.is_on: mute_sound
              - lambda: return !id(init_in_progress);
          then:
            - script.execute:
                id: play_sound
                priority: false
                sound_file: "mute_switch_off_sound"

  - platform: template
    id: mute_sound
    name: Mute-unmute sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  - platform: template
    id: wake_sound
    name: Wake sound
    icon: "mdi:bullhorn"
    entity_category: config
    optimistic: true
    restore_mode: RESTORE_DEFAULT_ON

  # Night mode (LEDs only; adaptive volume handles quiet nights):
  # "Night LED Ring Brightness" acts as a cap. On: remember the day brightness,
  # lower it only if above the cap. During: changes apply live but are not
  # kept. Off: restore the day brightness.
  - platform: template
    id: night_mode
    name: Night mode
    icon: "mdi:weather-night"
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    turn_on_action:
      - script.execute: night_mode_enter
    turn_off_action:
      - script.execute: night_mode_exit

  - platform: template
    id: timer_ringing
    optimistic: true
    internal: true
    restore_mode: ALWAYS_OFF
    on_turn_off:
      - micro_wake_word.disable_model: stop
      - script.execute: disable_repeat
      - if:
          condition:
            media_player.is_announcing: external_media_player
          then:
            media_player.stop:
              id: external_media_player
              announcement: true
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 0
          duration: 1.0s
      - script.execute: control_leds
    on_turn_on:
      - mixer_speaker.apply_ducking:
          id: media_mixing_input
          decibel_reduction: 10
          duration: 0.0s
      - micro_wake_word.enable_model: stop
      - script.execute: ring_timer
      - script.execute: control_leds
      - delay: 2min
      - switch.turn_off: timer_ringing

  - platform: template
    optimistic: true
    restore_mode: RESTORE_DEFAULT_OFF
    id: alarm_on
    icon: mdi:bell-badge
    name: "Alarm on"
    on_turn_on:
      - script.execute: control_leds
    on_turn_off:
      - script.execute: control_leds

number:
  # Digital level trim applied after the AFE (0 dB = unity, saved across reboots).
  # The ES7210 analogue gain is fixed by the es7210_gain_db substitution.
  - platform: esp_audio_stack
    mic_gain:
      id: mic_gain
      name: "Mic Gain (post-AFE trim)"
      entity_category: config
      disabled_by_default: true # tuning only
      # 0..+18 dB: digital attenuation can't undo clipping in the analogue chain
      # (lower es7210_gain_db instead), and more digital gain mostly adds noise.
      min_value: 0
      max_value: 18

  - platform: template
    id: va_gain_factor0
    name: "Gain Factor Ch0"
    entity_category: config
    disabled_by_default: true # tuning only
    min_value: 1
    max_value: 64
    step: 1
    restore_value: false # every boot starts at the YAML value (1); HA changes last until reboot
    initial_value: 1
    set_action:
      - lambda: |-
          id(mww_mic).set_gain_factor(x);   // adjust gain factor on the fly
      - logger.log:
          format: "[MWW MIC] Set gain factor to %.0f"
          args: ["x"]

  - platform: template
    id: va_gain_factor1
    name: "Gain Factor Ch1"
    entity_category: config
    disabled_by_default: true # tuning only
    min_value: 1
    max_value: 64
    step: 1
    restore_value: false # every boot starts at the YAML value (1); HA changes last until reboot
    initial_value: 1
    set_action:
      - lambda: |-
          id(va_mic).set_gain_factor(x);   // adjust gain factor on the fly
      - logger.log:
          format: "[VA MIC] Set gain factor to %.0f"
          args: ["x"]

  # Disabled: Home Assistant ignores auto gain / noise suppression sent by ESPHome satellites.
#  - platform: template
#    id: va_auto_gain
#    name: "VA Auto Gain"
#    entity_category: config
#    min_value: 1
#    max_value: 31
#    step: 1
#    restore_value: true
#    initial_value: 16
#    set_action:
#      - lambda: |-
#          id(va).set_auto_gain(x);   // adjust auto gain on the fly
#      - logger.log:
#          format: "[VA] Set auto gain to %.0f"
#          args: ["x"]

#  - platform: template
#    id: va_noise_suppression
#    name: "Noise Suppression"
#    entity_category: config
#    min_value: 0
#    max_value: 4
#    step: 1
#    restore_value: true
#    initial_value: 4
#    set_action:
#      - lambda: |-
#          id(va).set_noise_suppression_level(x);   // adjust noise suppression on the fly
#      - logger.log:
#          format: "[VA] Set noise suppression to %.0f"
#          args: ["x"]

  - platform: template
    id: led_ring_brightness
    name: "LED Ring Brightness"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.2
    max_value: 1.0
    step: 0.05
    initial_value: 0.8
    mode: slider
    on_value:
      - if:
          condition:
            light.is_on: status_ring
          then:
            - light.turn_on:
                id: status_ring
                brightness: !lambda 'return x;'

  - platform: template
    id: night_led_brightness
    name: "Night LED Ring Brightness"
    icon: mdi:brightness-4
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.2
    max_value: 1.0
    step: 0.05
    initial_value: 0.4
    mode: slider

sensor:
  # Battery voltage. Requires the hardware mod: 0R bridge on R78 pad 1 (BAT_ADC)
  # to pad 3 (GPIO6). Divider R2 200k / R11 100k -> pin sees 1/3 of the battery.
  # GPIO6 is ADC1 (works with Wi-Fi); it is also LCD_SDA3 (QSPI LCD only) and
  # P1 header pin 15, so leave both unused.
  - platform: adc
    pin: GPIO6
    id: battery_adc
    internal: true
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: 3.0 # divider ratio; fine-tune against a multimeter
    # Read every 30 s; report the median of the last 10 readings every 5 min
    # (ignores ADC noise and voltage dips while the speaker or Wi-Fi draw current).
    # Below 2.5 V the battery is disconnected (slide switch off / unplugged):
    # report "unknown" at once and restart the median, so a reconnected battery
    # is reported on its first reading.
    on_value:
      - lambda: |-
          enum { WINDOW = 10 };
          static float buf[WINDOW];
          static int count = 0, since_report = 0;
          static bool absent = false;
          if (x < 2.5f) {
            if (!absent) {
              absent = true;
              id(battery_voltage).publish_state(NAN);
              id(battery_level).publish_state(NAN);
            }
            count = 0; since_report = 0;
            return;
          }
          absent = false;
          buf[count % WINDOW] = x;
          count++;
          const bool first = (count == 1);
          if (!first && ++since_report < WINDOW) return;
          since_report = 0;
          const int n = std::min<int>(count, WINDOW);
          float s[WINDOW];
          // Insertion sort (n <= 10); std::sort here triggers a false -Warray-bounds in GCC 14
          for (int i = 0; i < n; i++) {
            float x_i = buf[i];
            int j = i;
            for (; j > 0 && s[j - 1] > x_i; j--) s[j] = s[j - 1];
            s[j] = x_i;
          }
          const float v = (n % 2) ? s[n / 2] : (s[n / 2 - 1] + s[n / 2]) / 2.0f;
          id(battery_voltage).publish_state(v);
          // Rough single-cell Li-ion level: 3.3 V = 0 %, 4.2 V = 100 % (linear).
          // Reads high while charging; approximate only.
          id(battery_level).publish_state(std::min(100.0f, std::max(0.0f, (v - 3.3f) / (4.2f - 3.3f) * 100.0f)));

  - platform: template
    id: battery_voltage
    name: "Battery voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: battery_level
    name: "Battery level"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: next_timer
    name: "Next timer"
    update_interval: never
    disabled_by_default: true
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"
    accuracy_decimals: 0

text_sensor:
  - platform: template
    id: next_timer_name
    name: "Next timer name"
    icon: "mdi:timer"
    disabled_by_default: true
  - platform: template
    name: "Alarm time"
    id: alarm_time
    icon: mdi:bell-ring

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  # AFE voice activity (also the speech gate for direction of arrival later)
  - platform: esp_afe
    esp_afe_id: afe_processor
    vad:
      id: voice_presence
      name: Voice Detected
      disabled_by_default: true

  - platform: gpio
    name: "Key1"
    internal: true
    pin:
      tca9555: ioexp
      number: 9 # not '12' as schematics say!
      inverted: true
    on_press:
      - media_player.volume_down: external_media_player

  - platform: gpio
    name: "Key2"
    internal: true
    pin:
      tca9555: ioexp
      number: 10
      inverted: true
    on_press:
      # A timer or alarm is ringing -> Play/Pause silences it (works even when muted)
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
          else:
            - media_player.toggle: external_media_player

  - platform: gpio
    name: "Key3"
    internal: true
    pin:
      tca9555: ioexp
      number: 11
      inverted: true
    on_press:
      - media_player.volume_up: external_media_player
