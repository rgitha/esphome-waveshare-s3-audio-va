sensor:
  # CPU load per core over the last 60 s (interval at the end)
  - platform: template
    id: cpu_load_core0
    name: CPU load core 0
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never
  - platform: template
    id: cpu_load_core1
    name: CPU load core 1
    unit_of_measurement: "%"
    accuracy_decimals: 1
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: never

  # Memory, loop time and temperature diagnostics: off by default (enable in HA when needed)
  - platform: debug
    free:
      name: "Heap free"
      entity_category: diagnostic
      disabled_by_default: true
    block:
      name: "Heap max block"
      entity_category: diagnostic
      disabled_by_default: true
    psram:
      name: "PSRAM free"
      entity_category: diagnostic
      disabled_by_default: true
    loop_time:
      name: "Loop time"
      entity_category: diagnostic
      disabled_by_default: true
  - platform: internal_temperature
    name: "ESP temperature"
    entity_category: diagnostic
    disabled_by_default: true
    update_interval: 60s
  # Battery voltage. Requires the hardware mod: 0R bridge on R78 pad 1 (BAT_ADC)
  # to pad 3 (GPIO6). Divider R2 200k / R11 100k -> pin sees 1/3 of the battery.
  # GPIO6 is ADC1 (works with Wi-Fi); it is also LCD_SDA3 (QSPI LCD only) and
  # P1 header pin 15, so leave both unused.
  - platform: adc
    pin: GPIO6
    id: battery_adc
    internal: true
    attenuation: 12db
    update_interval: 30s
    filters:
      - multiply: 3.0 # divider ratio; fine-tune against a multimeter
    # Read every 30 s; report the median of the last 10 readings every 5 min
    # (ignores ADC noise and voltage dips while the speaker or Wi-Fi draw current).
    # Below 2.5 V the battery is disconnected (slide switch off / unplugged):
    # report "unknown" at once and restart the median, so a reconnected battery
    # is reported on its first reading.
    on_value:
      - lambda: |-
          enum { WINDOW = 10 };
          static float buf[WINDOW];
          static int count = 0, since_report = 0;
          static bool absent = false;
          if (x < 2.5f) {
            if (!absent) {
              absent = true;
              id(battery_voltage).publish_state(NAN);
              id(battery_level).publish_state(NAN);
            }
            count = 0; since_report = 0;
            return;
          }
          absent = false;
          buf[count % WINDOW] = x;
          count++;
          const bool first = (count == 1);
          if (!first && ++since_report < WINDOW) return;
          since_report = 0;
          const int n = std::min<int>(count, WINDOW);
          float s[WINDOW];
          // Insertion sort (n <= 10); std::sort here triggers a false -Warray-bounds in GCC 14
          for (int i = 0; i < n; i++) {
            float x_i = buf[i];
            int j = i;
            for (; j > 0 && s[j - 1] > x_i; j--) s[j] = s[j - 1];
            s[j] = x_i;
          }
          const float v = (n % 2) ? s[n / 2] : (s[n / 2 - 1] + s[n / 2]) / 2.0f;
          id(battery_voltage).publish_state(v);
          // Rough single-cell Li-ion level: 3.3 V = 0 %, 4.2 V = 100 % (linear).
          // Reads high while charging; approximate only.
          id(battery_level).publish_state(std::min(100.0f, std::max(0.0f, (v - 3.3f) / (4.2f - 3.3f) * 100.0f)));

  - platform: template
    id: battery_voltage
    name: "Battery voltage"
    unit_of_measurement: "V"
    accuracy_decimals: 2
    device_class: voltage
    state_class: measurement
    entity_category: diagnostic
    update_interval: never

  - platform: template
    id: battery_level
    name: "Battery level"
    unit_of_measurement: "%"
    device_class: battery
    accuracy_decimals: 0
    update_interval: never

  - platform: template
    id: next_timer
    name: "Next timer"
    update_interval: never
    disabled_by_default: true
    device_class: duration
    unit_of_measurement: s
    icon: "mdi:timer"
    accuracy_decimals: 0

text_sensor:
  - platform: debug
    reset_reason:
      name: "Reset reason"
      entity_category: diagnostic
      disabled_by_default: true
  - platform: template
    id: next_timer_name
    name: "Next timer name"
    icon: "mdi:timer"
    disabled_by_default: true
  - platform: template
    name: "Alarm time"
    id: alarm_time
    icon: mdi:bell-ring

button:
  - platform: factory_reset
    id: factory_reset_button
    name: "Factory Reset"
    entity_category: diagnostic
    internal: true
  - platform: restart
    id: restart_button
    name: "Restart"
    entity_category: config
    disabled_by_default: true
    icon: "mdi:restart"

binary_sensor:
  # AFE voice activity (also the speech gate for direction of arrival later)
  - platform: gpio
    name: "Key1"
    internal: true
    pin:
      tca9555: ioexp
      number: 9 # not '12' as schematics say!
      inverted: true
    on_press:
      - media_player.volume_down: external_media_player

  - platform: gpio
    name: "Key2"
    internal: true
    pin:
      tca9555: ioexp
      number: 10
      inverted: true
    on_press:
      # A timer or alarm is ringing -> Play/Pause silences it (works even when muted)
      - if:
          condition:
            switch.is_on: timer_ringing
          then:
            - switch.turn_off: timer_ringing
          else:
            - media_player.toggle: external_media_player

  - platform: gpio
    name: "Key3"
    internal: true
    pin:
      tca9555: ioexp
      number: 11
      inverted: true
    on_press:
      - media_player.volume_up: external_media_player

interval:
  # mww_b and mww_c follow mww: the wake words Home Assistant enabled, and the cutoffs
  # set by the Wake word sensitivity select (stop is switched on all directly)
  - interval: 1s
    then:
      - lambda: |-
          auto a = id(mww).get_wake_words();
          for (auto *other : {id(mww_b), id(mww_c)}) {
            auto b = other->get_wake_words();
            for (size_t i = 0; i < a.size() && i < b.size(); i++) {
              if (a[i]->is_enabled() != b[i]->is_enabled()) {
                if (a[i]->is_enabled()) {
                  b[i]->enable();
                } else {
                  b[i]->disable();
                }
              }
              if (b[i]->get_probability_cutoff() != a[i]->get_probability_cutoff())
                b[i]->set_probability_cutoff(a[i]->get_probability_cutoff());
            }
          }

  # CPU load per core over the last 60 s (FreeRTOS run-time statistics), for the
  # CPU load sensors.
  - interval: 60s
    then:
      - lambda: |-
          struct Prev {
            TaskHandle_t handle;
            uint64_t time;
          };
          static std::vector<Prev> prev;
          static uint64_t prev_total = 0;
          const UBaseType_t cap = uxTaskGetNumberOfTasks() + 8;
          std::vector<TaskStatus_t> tasks(cap);
          configRUN_TIME_COUNTER_TYPE total = 0;
          const UBaseType_t n = uxTaskGetSystemState(tasks.data(), cap, &total);
          const bool first = prev_total == 0;
          const double elapsed = static_cast<double>(total - prev_total);
          double idle[2] = {0, 0};
          std::vector<Prev> next;
          next.reserve(n);
          for (UBaseType_t i = 0; i < n; i++) {
            const TaskStatus_t &t = tasks[i];
            const uint64_t now = t.ulRunTimeCounter;
            next.push_back({t.xHandle, now});
            uint64_t before = 0;
            for (const auto &p : prev)
              if (p.handle == t.xHandle)
                before = p.time;
            if (now < before)
              before = 0;  // a new task at the address of a deleted one (e.g. the AFE rebuilt)
