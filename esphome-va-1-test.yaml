#          id(va).set_auto_gain(x);   // adjust auto gain on the fly
#      - logger.log:
#          format: "[VA] Set auto gain to %.0f"
#          args: ["x"]

#  - platform: template
#    id: va_noise_suppression
#    name: "Noise Suppression"
#    entity_category: config
#    min_value: 0
#    max_value: 4
#    step: 1
#    restore_value: true
#    initial_value: 4
#    set_action:
#      - lambda: |-
#          id(va).set_noise_suppression_level(x);   // adjust noise suppression on the fly
#      - logger.log:
#          format: "[VA] Set noise suppression to %.0f"
#          args: ["x"]

  # Output boosts over the media player volume (see the boost substitutions)
  - platform: template
    id: announcement_boost
    name: "Announcement boost"
    icon: mdi:bullhorn
    entity_category: config
    unit_of_measurement: dB
    optimistic: true
    restore_value: true
    min_value: -6
    max_value: 6
    step: 3
    initial_value: ${announcement_boost_db}
    mode: slider
    on_value:
      - script.execute: update_boost

  - platform: template
    id: music_boost
    name: "Music boost"
    icon: mdi:music
    entity_category: config
    unit_of_measurement: dB
    optimistic: true
    restore_value: true
    min_value: -6
    max_value: 6
    step: 3
    initial_value: ${music_boost_db}
    mode: slider
    on_value:
      - script.execute: update_boost

  - platform: template
    id: led_ring_brightness
    name: "LED Ring Brightness"
    icon: mdi:brightness-6
    entity_category: config
    optimistic: true
    restore_value: true
    min_value: 0.2
    max_value: 1.0
    step: 0.05
    initial_value: 0.8
    mode: slider
    on_value:
      - if:
          condition:
            light.is_on: status_ring
          then:
            - light.turn_on:
